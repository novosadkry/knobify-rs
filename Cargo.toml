[workspace]
resolver = "2"
members = ["crates/knobify-core", "crates/knobify"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/novosadkry/knobify-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
