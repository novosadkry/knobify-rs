# Knobify is a Windows-only application: the binary crate pulls in tray-icon and
# rdev, which do not build for a Linux host without GTK/X11 development
# libraries. There is deliberately no `[build] target` here, so that a native
# Windows checkout just works:
#
#   Windows:  cargo build --release                       (host x86_64-pc-windows-msvc)
#   Linux:    cargo build --release --target x86_64-pc-windows-gnu
#             cargo test -p knobify-core                  (the core crate is portable)
#
# The linker below only takes effect for the cross-compiled GNU target, so it is
# harmless on a machine without mingw-w64 installed.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
