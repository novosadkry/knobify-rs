[package]
name = "knobify-core"
description = "Platform-independent core of Knobify: settings, volume model, Spotify service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", default-features = false }
dirs = "6"
webbrowser = "1"
serde_json = "1"
url = "2"
rspotify = { version = "0.16.1", default-features = false, features = ["client-reqwest", "reqwest-rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "io-util", "test-util"] }
