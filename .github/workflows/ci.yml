name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core-tests:
    name: Core tests + Windows cross-check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Core tests (host)
        run: cargo test -p knobify-core --target x86_64-unknown-linux-gnu
      - name: Clippy (Windows target)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  windows-build:
    name: Build + test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --target x86_64-pc-windows-msvc
      - name: Release build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: knobify-windows-x64
          path: target/x86_64-pc-windows-msvc/release/knobify.exe
          if-no-files-found: error
